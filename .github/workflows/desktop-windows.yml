name: Windows desktop beta preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'fixtures/**'
      - 'scripts/build-windows-collision-deps.sh'
      - 'scripts/package-windows-desktop.py'
      - 'scripts/tests/test_windows_bundle.py'
      - '.github/workflows/desktop-windows.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'fixtures/**'
      - 'scripts/build-windows-collision-deps.sh'
      - 'scripts/package-windows-desktop.py'
      - 'scripts/tests/test_windows_bundle.py'
      - '.github/workflows/desktop-windows.yml'
permissions:
  contents: read
jobs:
  desktop:
    name: Desktop viewer / Windows / x64
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gtest
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-vtk
            mingw-w64-ucrt-x86_64-mesa
            mingw-w64-ucrt-x86_64-python
            curl
            git
      - name: Build pinned collision dependencies
        run: |
          if ! bash scripts/build-windows-collision-deps.sh > "$RUNNER_TEMP/windows-deps.log" 2>&1; then
            tail -n 80 "$RUNNER_TEMP/windows-deps.log"
            echo "::error title=Windows dependency compiler errors::$(grep -E 'error:|fatal error|CMake Error' "$RUNNER_TEMP/windows-deps.log" | head -n 12 | tr '\n' ' ' | cut -c 1-6000)"
            echo "::error title=Windows dependencies::$(tail -n 25 "$RUNNER_TEMP/windows-deps.log" | tr '\n' ' ' | cut -c 1-6000)"
            exit 1
          fi
      - name: Configure and build Release viewer and tests
        run: |
          if ! {
            cmake --preset desktop-release -DOCCLUSION_FETCH_DEPENDENCIES=OFF \
              -DCMAKE_PREFIX_PATH="$(cygpath -m "$PWD/build/windows-deps/install");$(cygpath -m "$MINGW_PREFIX")" &&
            cmake --build --preset desktop-release --parallel 2
          } > "$RUNNER_TEMP/windows-build.log" 2>&1; then
            echo "::error title=Windows desktop build::$(tail -n 35 "$RUNNER_TEMP/windows-build.log" | tr '\n' ' ' | cut -c 1-6000)"
            exit 1
          fi
          cp "$MINGW_PREFIX/bin/opengl32.dll" build/native/desktop-release/native/apps/occlusion-desktop/
      - name: Test native contracts and desktop flow
        run: |
          export PATH="$PWD/build/windows-deps/install/bin:$PATH"
          export GALLIUM_DRIVER=llvmpipe
          if ! ctest --preset desktop-release > "$RUNNER_TEMP/windows-tests.log" 2>&1; then
            echo "::error title=Windows desktop CTest::$(tail -n 90 "$RUNNER_TEMP/windows-tests.log" | tr '\n' ' ' | cut -c 1-6000)"
            exit 1
          fi
          python -m unittest discover -s scripts/tests -p 'test_windows_bundle.py' -v
      - name: Package and audit DLL dependencies
        run: |
          if ! python scripts/package-windows-desktop.py \
            build/native/desktop-release/native/apps/occlusion-desktop/occlusion-desktop.exe \
            "$(cygpath -m "$MINGW_PREFIX")" "$RUNNER_TEMP/Occlusion Lab" \
            --collision-prefix "$(cygpath -m "$PWD/build/windows-deps/install")" \
            > "$RUNNER_TEMP/windows-package.log" 2>&1; then
            echo "::error title=Windows desktop package::$(tail -n 30 "$RUNNER_TEMP/windows-package.log" | tr '\n' ' ' | cut -c 1-6000)"
            exit 1
          fi
          pacman -Q > "$RUNNER_TEMP/Occlusion Lab/build-packages.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/Occlusion Lab/build-commit.txt"
      - name: Launch extracted preview without toolchain paths
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'occlusion-lab-windows-x64.zip'
          Compress-Archive -Path "$env:RUNNER_TEMP/Occlusion Lab" -DestinationPath $archive
          $testRoot = Join-Path $env:RUNNER_TEMP 'preview extraction test'
          Expand-Archive -Path $archive -DestinationPath $testRoot
          $bundle = Join-Path $testRoot 'Occlusion Lab'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          foreach ($key in @('QT_PLUGIN_PATH', 'QT_QPA_PLATFORM_PLUGIN_PATH', 'QML2_IMPORT_PATH', 'QTDIR')) {
            Remove-Item "Env:$key" -ErrorAction SilentlyContinue
          }
          $env:QT_QPA_PLATFORM = 'windows'
          $env:GALLIUM_DRIVER = 'llvmpipe'
          $env:OCCLUSION_DESKTOP_SMOKE_WINDOW = Join-Path $env:RUNNER_TEMP 'windows-smoke.png'
          $stdout = Join-Path $env:RUNNER_TEMP 'windows-launch-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'windows-launch-stderr.log'
          $process = Start-Process -FilePath "$bundle/occlusion-desktop.exe" -ArgumentList @('--smoke', ('"{0}"' -f $bundle)) -WorkingDirectory $env:RUNNER_TEMP -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            throw 'Packaged desktop smoke timed out'
          }
          $process.WaitForExit()
          if ($process.ExitCode -ne 0 -or -not (Select-String -Path $stdout -Pattern 'smoke: PASS' -Quiet) -or -not (Test-Path $env:OCCLUSION_DESKTOP_SMOKE_WINDOW)) {
            $details = (Get-Content $stderr -Tail 25) -join ' '
            Write-Output "::error title=Windows packaged launch::Exit $($process.ExitCode): $details"
            throw 'Packaged desktop smoke failed'
          }
          Get-FileHash $archive -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  occlusion-lab-windows-x64.zip" } | Set-Content "$archive.sha256"
      - name: Upload Windows beta preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: occlusion-lab-windows-x64-preview
          path: |
            ${{ runner.temp }}/occlusion-lab-windows-x64.zip
            ${{ runner.temp }}/occlusion-lab-windows-x64.zip.sha256
            ${{ runner.temp }}/windows-smoke.png
          if-no-files-found: error
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-desktop-diagnostics
          path: ${{ runner.temp }}/windows-*.log
