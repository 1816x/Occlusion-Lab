name: Native core, collision and evaluation
on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'native/**'
      - 'fixtures/parity/contact-normalization-v1.json'
      - 'fixtures/parity/single-pose-collision-v1.json'
      - 'fixtures/parity/evaluated-sweep-summary-v1.json'
      - 'scripts/parity/evaluated-sweep-summary-fixture.ts'
      - 'scripts/parity/cli.mjs'
      - 'package.json'
      - 'vcpkg.json'
      - '.github/workflows/native.yml'
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'native/**'
      - 'fixtures/parity/contact-normalization-v1.json'
      - 'fixtures/parity/single-pose-collision-v1.json'
      - 'fixtures/parity/evaluated-sweep-summary-v1.json'
      - 'scripts/parity/evaluated-sweep-summary-fixture.ts'
      - 'scripts/parity/cli.mjs'
      - 'package.json'
      - 'vcpkg.json'
      - '.github/workflows/native.yml' 
permissions:
  contents: read
jobs:
  core:
    name: Core / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Configure core without FCL
        run: cmake --preset native-debug
      - name: Build core, CLI and parity tests
        run: cmake --build --preset native-debug --parallel
      - name: Test core, CLI, pose and sweep parity
        run: ctest --preset native-debug --output-on-failure

  collision:
    name: Collision + evaluation / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x64-linux
            compiler: gcc
          - os: windows-latest
            triplet: x64-windows
            compiler: msvc
          - os: macos-latest
            triplet: arm64-osx
            compiler: appleclang
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Initialize vcpkg paths (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-binary-cache" >> "$GITHUB_ENV"
      - name: Initialize vcpkg paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$env:RUNNER_TEMP\vcpkg-binary-cache" >> $env:GITHUB_ENV
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            ${{ runner.temp }}/vcpkg/downloads
            ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-${{ matrix.triplet }}-${{ matrix.compiler }}-f3457518-${{ hashFiles('vcpkg.json') }}
      - name: Bootstrap pinned vcpkg (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout f3457518c19c4efdb3b9307a8bb4e27d4b989933
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Bootstrap pinned vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT checkout f3457518c19c4efdb3b9307a8bb4e27d4b989933
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
      - name: Configure collision Debug
        run: cmake --preset collision-debug -DOCCLUSION_FETCH_DEPENDENCIES=OFF -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
      - name: Build collision Debug
        run: cmake --build --preset collision-debug --parallel
      - name: Test collision semantics and normalization fixture
        run: ctest --preset collision-debug --output-on-failure

  sanitizers:
    name: Collision + evaluation / Ubuntu / ASan+UBSan
    runs-on: ubuntu-latest
    env:
      VCPKG_TARGET_TRIPLET: x64-linux
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Initialize runner-specific vcpkg paths
        run: |
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-binary-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            ${{ runner.temp }}/vcpkg/downloads
            ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-x64-linux-gcc-f3457518-${{ hashFiles('vcpkg.json') }}
      - name: Bootstrap pinned vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout f3457518c19c4efdb3b9307a8bb4e27d4b989933
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Configure sanitizers
        run: cmake --preset collision-sanitizers -DOCCLUSION_FETCH_DEPENDENCIES=OFF -DVCPKG_TARGET_TRIPLET=x64-linux -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build sanitizers
        run: cmake --build --preset collision-sanitizers --parallel
      - name: Run collision and evaluation tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --preset collision-sanitizers --output-on-failure
