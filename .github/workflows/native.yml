name: Native core, collision and evaluation
on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'native/**'
      - 'fixtures/parity/contact-normalization-v1.json'
      - 'fixtures/parity/mandibular-pose-v1.json'
      - 'fixtures/parity/mandibular-sweep-generation-v1.json'
      - 'fixtures/parity/single-pose-collision-v1.json'
      - 'fixtures/parity/evaluated-sweep-summary-v1.json'
      - 'fixtures/export/**'
      - 'fixtures/mesh-io/**'
      - 'schemas/native-evaluation-v1.schema.json'
      - 'schemas/native-mesh-inspection-v1.schema.json'
      - 'scripts/parity/evaluated-sweep-summary-fixture.ts'
      - 'scripts/parity/cli.mjs'
      - 'package.json'
      - 'vcpkg.json'
      - '.github/workflows/native.yml'
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'native/**'
      - 'fixtures/parity/contact-normalization-v1.json'
      - 'fixtures/parity/mandibular-pose-v1.json'
      - 'fixtures/parity/mandibular-sweep-generation-v1.json'
      - 'fixtures/parity/single-pose-collision-v1.json'
      - 'fixtures/parity/evaluated-sweep-summary-v1.json'
      - 'fixtures/export/**'
      - 'fixtures/mesh-io/**'
      - 'schemas/native-evaluation-v1.schema.json'
      - 'schemas/native-mesh-inspection-v1.schema.json'
      - 'scripts/parity/evaluated-sweep-summary-fixture.ts'
      - 'scripts/parity/cli.mjs'
      - 'package.json'
      - 'vcpkg.json'
      - '.github/workflows/native.yml' 
permissions:
  contents: read
jobs:
  core:
    name: Core / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Configure core without FCL
        run: cmake --preset native-debug
      - name: Build core, CLI and parity tests
        run: cmake --build --preset native-debug --parallel
      - name: Test core, CLI, pose and sweep parity
        run: ctest --preset native-debug --output-on-failure

  collision:
    name: Collision + evaluation / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x64-linux
            compiler: gcc
          - os: windows-latest
            triplet: x64-mingw-dynamic-release-deps
            compiler: mingw
          - os: macos-latest
            triplet: arm64-osx
            compiler: appleclang
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Initialize vcpkg paths (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-binary-cache" >> "$GITHUB_ENV"
      - name: Initialize vcpkg paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$env:RUNNER_TEMP\vcpkg-binary-cache" >> $env:GITHUB_ENV
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            ${{ runner.temp }}/vcpkg/downloads
            ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-${{ matrix.triplet }}-${{ matrix.compiler }}-f3457518-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-triplets/**') }}
      - name: Bootstrap pinned vcpkg (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git init "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          for attempt in 1 2 3; do
            if git -c http.version=HTTP/1.1 -C "$VCPKG_ROOT" fetch --depth 1 origin f3457518c19c4efdb3b9307a8bb4e27d4b989933; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done
          git -C "$VCPKG_ROOT" checkout --detach FETCH_HEAD
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Bootstrap pinned vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git init $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT remote add origin https://github.com/microsoft/vcpkg.git
          $fetched = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git -c http.version=HTTP/1.1 -C $env:VCPKG_ROOT fetch --depth 1 origin f3457518c19c4efdb3b9307a8bb4e27d4b989933
            if ($LASTEXITCODE -eq 0) { $fetched = $true; break }
            Start-Sleep -Seconds 5
          }
          if (-not $fetched) { throw 'Cannot fetch pinned vcpkg commit' }
          git -C $env:VCPKG_ROOT checkout --detach FETCH_HEAD
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
      - name: Configure collision Debug
        if: runner.os != 'Windows'
        run: cmake --preset collision-debug -DOCCLUSION_FETCH_DEPENDENCIES=OFF -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
      - name: Configure collision Debug with MinGW
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & cmake --preset collision-debug -DOCCLUSION_FETCH_DEPENDENCIES=OFF -DVCPKG_TARGET_TRIPLET=x64-mingw-dynamic-release-deps -DVCPKG_OVERLAY_TRIPLETS="$env:GITHUB_WORKSPACE/cmake/vcpkg-triplets" -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\occlusion-configure.log"
          $configureExit = $LASTEXITCODE
          if ($configureExit -ne 0) {
            $errors = Select-String -Path "$env:RUNNER_TEMP\occlusion-configure.log" -Pattern 'CMake Error|error C[0-9]+|fatal error|error:|Could not find|FAILED:'
            $details = @($errors | Select-Object -Last 12)
            if ($details.Count -eq 0) { $details = @(Get-Content "$env:RUNNER_TEMP\occlusion-configure.log" -Tail 12) }
            foreach ($detail in $details) {
              $line = if ($detail -is [string]) { $detail } else { $detail.Line }
              $line = $line.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Windows native configure::$line"
            }
            exit $configureExit
          }
      - name: Build collision Debug
        if: runner.os != 'Windows'
        run: cmake --build --preset collision-debug --parallel
      - name: Build collision Debug (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & cmake --build --preset collision-debug --parallel 2 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\occlusion-build.log"
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            $errors = Select-String -Path "$env:RUNNER_TEMP\occlusion-build.log" -Pattern 'error C[0-9]+|fatal error|LNK[0-9]+|FAILED:|error:'
            foreach ($match in ($errors | Select-Object -First 12)) {
              $line = $match.Line.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Windows native build::$line"
            }
            exit $buildExit
          }
      - name: Test collision semantics and normalization fixture
        if: runner.os != 'Windows'
        run: ctest --preset collision-debug --output-on-failure
      - name: Test collision semantics and normalization fixture (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dependencyBin = Join-Path $env:GITHUB_WORKSPACE 'build/native/collision-debug/vcpkg_installed/x64-mingw-dynamic-release-deps/bin'
          $env:PATH = "$dependencyBin;$env:PATH"
          & ctest --preset collision-debug --output-on-failure 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\occlusion-ctest.log"
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $tail = (Get-Content "$env:RUNNER_TEMP\occlusion-ctest.log" -Tail 100) -join "`n"
            $details = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows native CTest output::$details"
            exit $testExit
          }

  geometry:
    name: CGAL geometry / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install CGAL development package
        run: |
          sudo apt-get update
          sudo apt-get install -y libcgal-dev
      - name: Configure geometry Debug
        run: cmake --preset geometry-debug
      - name: Build geometry Debug
        run: cmake --build --preset geometry-debug --parallel
      - name: Test geometry and core
        run: ctest --preset geometry-debug --output-on-failure

  sanitizers:
    name: Collision + evaluation / Ubuntu / ASan+UBSan
    runs-on: ubuntu-latest
    env:
      VCPKG_TARGET_TRIPLET: x64-linux
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Initialize runner-specific vcpkg paths
        run: |
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-binary-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            ${{ runner.temp }}/vcpkg/downloads
            ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-x64-linux-gcc-f3457518-${{ hashFiles('vcpkg.json') }}
      - name: Bootstrap pinned vcpkg
        run: |
          git init "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          for attempt in 1 2 3; do
            if git -c http.version=HTTP/1.1 -C "$VCPKG_ROOT" fetch --depth 1 origin f3457518c19c4efdb3b9307a8bb4e27d4b989933; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done
          git -C "$VCPKG_ROOT" checkout --detach FETCH_HEAD
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Configure sanitizers
        run: cmake --preset collision-sanitizers -DOCCLUSION_FETCH_DEPENDENCIES=OFF -DVCPKG_TARGET_TRIPLET=x64-linux -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build sanitizers
        run: cmake --build --preset collision-sanitizers --parallel
      - name: Run collision and evaluation tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --preset collision-sanitizers --output-on-failure
