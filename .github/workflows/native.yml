name: Native foundation

on:
  pull_request:
    paths:
      - ".github/workflows/native.yml"
      - "cmake/**"
      - "native/**"
      - "fixtures/parity/**"
      - ".clang-format"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.os }} / C++20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      VCPKG_ROOT: ${{ runner.temp }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-binary-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Cache vcpkg downloads and binaries
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            ${{ runner.temp }}/vcpkg/downloads
            ${{ runner.temp }}/vcpkg-binary-cache
          key: native-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Bootstrap pinned vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout f3457518c19c4efdb3b9307a8bb4e27d4b989933
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi

      - name: Configure
        shell: bash
        run: >-
          cmake --preset native-debug
          -DOCCLUSION_FETCH_DEPENDENCIES=OFF
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build --preset native-debug --parallel

      - name: Test
        run: ctest --preset native-debug --output-on-failure

      - name: Verify formatting
        shell: bash
        run: >-
          find native -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 |
          xargs -0 clang-format --dry-run --Werror
